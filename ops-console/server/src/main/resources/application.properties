# Server port
server.port=8080

# JSON output: pretty-print in dev so log dumps are readable
spring.jackson.serialization.indent-output=false

# Multipart limits — APK uploads can be hundreds of MB. Spring's defaults
# (1 MB per file, 10 MB per request) reject them before our code runs.
# Threshold is 0 so nothing is buffered in memory; the controller streams
# straight to disk from the servlet input stream and checks the running total.
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
spring.servlet.multipart.file-size-threshold=0

# Logging
logging.level.aero.panasonic.ek.ops=INFO
logging.level.org.springframework.web=INFO

# DevTools: hot reload is automatic when the dependency is on the
# classpath. Restart-on-class-change is on by default; livereload
# port stays off so we don't conflict with anything.
spring.devtools.livereload.enabled=false
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
